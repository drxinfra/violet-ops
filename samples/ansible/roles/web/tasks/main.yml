---
# Install nginx and render the site config.
- name: "Web | install packages"
  ansible.builtin.apt:
    name: "{{ web_packages }}"
    state: present
    update_cache: true
  become: true

- name: "Web | render nginx config"
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/sites-available/{{ web_site_name }}.conf"
    mode: "0644"
  notify: reload nginx
  register: _web_conf

- name: "Web | collect upstreams that answer"
  ansible.builtin.set_fact:
    _web_alive: >-
      {{ web_upstreams
         | selectattr('enabled', 'defined') | selectattr('enabled')
         | map(attribute='host') | list }}

- name: "Web | open firewall ports"
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ web_ports }}"
  when: web_firewall_enabled | bool and _web_conf is changed
