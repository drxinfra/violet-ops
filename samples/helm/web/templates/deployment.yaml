{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | lower }}
  labels:
    {{- include "web.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  template:
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $svc.image }}:{{ $.Chart.AppVersion }}"
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
{{- end }}
{{- end }}
